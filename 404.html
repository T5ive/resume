<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // SPA redirect for GitHub Pages
    var path = window.location.pathname;
    var query = window.location.search;
    var hash = window.location.hash;
    var redirectUrl = window.location.origin + '/?p=' + encodeURIComponent(path) + (query ? '&q=' + encodeURIComponent(query) : '') + hash;
    window.location.replace(redirectUrl);
  </script>
</head>
</html>
